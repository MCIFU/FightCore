# Weekly data update: new results, upcoming cards, titles and portraits.
#
# Runs every Monday at 08:00 Spanish time (Europe/Madrid), after the weekend's
# events, and on demand from Actions → "Actualización semanal de datos" → Run.
# GitHub's cron only speaks UTC: 08:00 in Madrid is 06:00 UTC in summer (CEST)
# and 07:00 UTC in winter (CET). Both are scheduled and the first step lets
# through only the one that matches Madrid's offset that day, so the time stays
# right across daylight saving changes even if GitHub starts the run late.
# It imports every source, checks the result (tests, duplicates, build) and,
# only if everything passes, commits the new snapshot to the branch it runs on.
# Vercel redeploys that branch on push.
#
# Scheduled workflows run on the repository's default branch: this file must be
# there for the weekly run to happen.
name: Actualización semanal de datos

on:
  schedule:
    - cron: "0 6 * * 1" # 08:00 CEST (summer)
    - cron: "0 7 * * 1" # 08:00 CET (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Is it 08:00 in Madrid?
        id: when
        run: |
          offset=$(TZ=Europe/Madrid date +%z)   # +0200 summer, +0100 winter
          want="${{ github.event.schedule }}"
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$want" = "0 6 * * 1" ] && [ "$offset" != "+0200" ]; then go=false; fi
            if [ "$want" = "0 7 * * 1" ] && [ "$offset" != "+0100" ]; then go=false; fi
          fi
          echo "Madrid UTC$offset · ejecutar: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.when.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.when.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.when.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.when.outputs.go == 'true'
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq pngquant
          pip install --quiet opencv-python-headless "mediapipe==0.10.14" numpy

      # Downloaded pages and API answers. Old results never change, so keeping
      # them saves thousands of requests; recent ones expire inside the scripts.
      - name: Restore download cache
        if: steps.when.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: data/.cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: UFC (UFCStats, Wikidata, Wikipedia)
        if: steps.when.outputs.go == 'true'
        run: npx tsx scripts/import-ufc.mts --refresh

      - name: Birthplaces from Wikipedia
        if: steps.when.outputs.go == 'true'
        run: npm run enrich:wiki

      - name: Official UFC portraits (new fighters)
        if: steps.when.outputs.go == 'true'
        run: npm run photos:espn

      - name: Other organizations (ESPN)
        if: steps.when.outputs.go == 'true'
        run: npm run import:orgs

      - name: ONE, KSW and RIZIN (Wikipedia)
        if: steps.when.outputs.go == 'true'
        run: npm run import:wiki-orgs

      - name: Crop new portraits
        if: steps.when.outputs.go == 'true'
        run: python scripts/process-photos.py --official-only

      - name: Check
        if: steps.when.outputs.go == 'true'
        run: |
          npm run typecheck
          npm test
          npm run check:duplicates
          npm run build

      - name: Commit and push
        if: steps.when.outputs.go == 'true'
        run: |
          git config user.name "fightcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot public/photos/official
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "Datos: actualización semanal $(date -u +%Y-%m-%d)"
          git push
